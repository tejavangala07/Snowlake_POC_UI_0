;color:#8294c5}.kpiValue{font-size:29px;font-weight:650;letter-spacing:-1px;margin:13px 0 10px}.kpi small{color:var(--muted)}.positive{color:var(--green);font-size:11px;margin-right:5px}.gridMain{display:grid;grid-template-columns:1.85fr 1fr;gap:23px;margin-bottom:23px}.cardHead{display:flex;justify-content:space-between;align-items:center;padding:23px 24px 8px;gap:12px}.cardHead p{font-size:11px;color:var(--muted);margin-top:6px}.seg{display:flex;background:#f5f7fa;border-radius:6px;padding:3px;gap:2px}.seg button{border:0;font-size:10px;padding:6px 8px;background:transparent;color:var(--muted)}.seg button.on{background:white;box-shadow:0 1px 4px #0001;color:var(--blue)}.chart{padding:10px 22px 8px}.chart svg{width:100%;height:240px;overflow:visible}.legend{display:flex;justify-content:center;gap:24px;color:var(--muted);font-size:10px;padding:0 0 20px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.distribution{display:flex;align-items:center;gap:25px;padding:27px 24px}.donut{width:142px;height:142px;border-radius:50%;background:conic-gradient(#5873e5 0 50%,#96a8f4 50% 81%,#cfd8fc 81% 100%);display:grid;place-items:center;flex-shrink:0}.donutInner{width:111px;height:111px;border-radius:50%;background:white;text-align:center;display:flex;flex-direction:column;justify-content:center}.donutInner strong{font-size:27px}.donutInner small{color:var(--muted);margin-top:4px}.distList{flex:1}.distList div{display:flex;align-items:center;font-size:11px;margin:17px 0}.distList b{margin-left:auto}.cardFoot{border-top:1px solid var(--line);padding:16px 24px;font-size:11px;color:var(--muted)}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#93a0b0;background:#fafbfd;font-weight:500;padding:13px 24px}td{padding:16px 24px;border-top:1px solid #f0f2f6;font-size:12px;color:#66748a}td strong{font-weight:550;color:var(--ink)}.fileIcon{padding:9px;border-radius:7px;background:#f0f4ff;color:#6480c2;margin-right:11px}.fileIcon.green{background:#edf7f3;color:#53a68a}.fileIcon.amber{background:#fff5eb;color:#c49a63}.textButton{border:0;color:var(--blue);padding:5px;background:transparent;font-size:12px}.insight{display:flex;align-items:center;gap:15px;background:#eff3ff;border:1px solid #e4eaff;padding:19px 22px;border-radius:10px;margin-top:23px}.insight p{font-size:12px;color:#7c89a6;line-height:1.6;margin-top:4px}.insight .icon{color:var(--blue)}.padded{padding:25px}.uploadZone{border:1.5px dashed #b8c5ed;border-radius:12px;text-align:center;padding:48px 20px;background:#fbfcff;margin:24px}.uploadZone.drag{background:#eaf0ff}.uploadCircle{width:60px;height:60px;border-radius:16px;background:#edf1ff;color:var(--blue);display:grid;place-items:center;margin:0 auto 18px}.uploadCircle .icon{width:28px;height:28px}.uploadZone p{color:var(--muted);margin:10px 0 22px;font-size:12px}.formats{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap}.formats span{font-size:10px;background:white;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);line-height:1.7}.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}input,select{border:1px solid #dfe5ee;border-radius:8px;padding:11px 13px;background:white;color:var(--ink)}input:focus,select:focus{outline:2px solid #c8d3ff}.searchInput{min-width:250px}.querybox{display:flex;gap:12px;margin:20px 0}.querybox input{flex:1;min-width:0;padding:16px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{font-size:11px;color:#7182a4;background:#f8faff}.answer{margin-top:24px;padding:25px;line-height:1.8}.answer h2{margin-bottom:12px}.bars{display:flex;flex-direction:column;gap:19px;margin-top:28px}.barrow{display:grid;grid-template-columns:110px 1fr 65px;gap:14px;align-items:center;font-size:12px}.bartrack{height:24px;background:#f5f7fc;border-radius:4px;overflow:hidden}.barfill{height:100%;background:#7189e9;border-radius:4px}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:24px}pre{white-space:pre-wrap;word-break:break-word;background:#152237;color:#b9c9eb;padding:22px;border-radius:9px;font:12px/1.9 Consolas,monospace}.pipeline{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.pipeline span{background:#f0f4ff;border:1px solid #e0e7fb;color:#647bb9;padding:10px 14px;border-radius:6px;font-size:11px}.settingsRow{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);gap:15px}.settingsRow p{font-size:12px;color:var(--muted);margin-top:6px}.toggle{accent-color:var(--blue);width:18px;height:18px}.empty{text-align:center;padding:50px;color:var(--muted)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#20334e;color:white;padding:13px 22px;border-radius:9px;box-shadow:0 5px 22px #0002;z-index:100;font-size:13px;max-width:90%}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:white}.loginArt{background:#eef2fb;padding:55px 65px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.loginArt h1{font-size:46px;line-height:1.16;max-width:470px;letter-spacing:-2px;margin:35px 0 20px}.loginArt p{color:#7c8ba7;line-height:1.9;max-width:420px}.abstract{height:220px;display:flex;align-items:flex-end;gap:14px;margin:30px 0 45px;border-bottom:1px solid #d8e0f2}.abstract i{flex:1;background:#b5c4f3;border-radius:7px 7px 0 0}.abstract i:nth-child(even){background:#6e88e3}.loginFormWrap{display:grid;place-items:center;padding:35px}.loginForm{width:100%;max-width:360px}.loginForm h1{font-size:27px;margin-bottom:12px}.loginForm>p{color:var(--muted);line-height:1.7;margin-bottom:32px;font-size:13px}.loginForm label{display:block;font-size:12px;margin:20px 0 8px}.loginForm input{width:100%;padding:13px}.loginForm .primary{width:100%;padding:14px;margin-top:24px}.demoNote{background:#f7f9fd;border:1px solid var(--line);padding:15px;border-radius:8px;font-size:11px;line-height:1.9;color:#8390a7;margin-top:25px}.loginError{color:#bd4a4a;font-size:12px;margin-top:15px;min-height:15px}.mobileMenu{display:none}.hide{display:none!important}.footerNote{margin-top:23px;font-size:10px;color:#9aa5b4;text-align:center}dialog{border:1px solid var(--line);border-radius:14px;padding:27px;width:560px;max-width:90vw;box-shadow:0 15px 70px #17284b30}dialog::backdrop{background:#15233e55}dialog h2{margin-bottom:15px}dialog pre{max-height:50vh;overflow:auto}body.compact .sidebar{width:82px;padding:30px 12px}body.compact .sidebar .brand{padding:0}body.compact .sidebar .brandtext,body.compact .nav button span,body.compact .navlabel,body.compact .sidefoot{display:none}body.compact .workspace{margin-left:82px}body.compact .nav button{justify-content:center;padding:13px}body.compact .brandmark{margin:auto}
@media(min-width:1500px){.distribution{gap:40px}.donut{width:165px;height:165px}.donutInner{width:131px;height:131px}}@media(max-width:1150px){.sidebar{width:205px}.workspace{margin-left:205px}.content{padding:28px 23px}.header{padding:0 23px}.distribution{flex-direction:column;gap:0}.distList{width:100%}.distList div{margin:10px 0}.kpi{padding:17px}.gridMain{grid-template-columns:1.6fr 1fr}}@media(max-width:800px){.sidebar{transform:translateX(-100%);width:235px}.sidebar.open{transform:none;box-shadow:10px 0 40px #0002}.workspace,body.compact .workspace{margin-left:0}.mobileMenu{display:block}.header{height:66px;padding:0 18px}.crumb{display:none}.content{padding:24px 18px}.kpis{grid-template-columns:repeat(2,1fr)}.gridMain,.twoCol{grid-template-columns:1fr}.distribution{flex-direction:row}.login{grid-template-columns:1fr}.loginArt{display:none}.pagehead{align-items:flex-start}.pagehead h1{font-size:23px}.headerRight .badge{display:none}.querybox{flex-direction:column}.profileButton{padding-left:0}.pagehead .row{flex-wrap:wrap;justify-content:flex-end}.insight{align-items:flex-start}.barrow{grid-template-columns:85px 1fr 50px}.seg{flex-shrink:0}body.compact .sidebar{width:235px}body.compact .sidebar .brandtext,body.compact .nav button span{display:block}.searchInput{min-width:0;width:100%}}

<body><div id="root"></div><div id="toast" class="toast hide" role="status"></div><dialog id="modal"><div class="row"><h2 id="modalTitle"></h2><div class="spacer"></div><button onclick="document.getElementById('modal').close()" aria-label="Close">×</button></div><div id="modalBody"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',upload:'M12 16V3 M7 8l5-5 5 5 M4 15v6h16v-6',files:'M14 2H5v20h14V7z M14 2v6h5 M8 12h8 M8 16h6',explorer:'M3 4h18v16H3z M3 9h18 M9 9v11',query:'M4 4h16v13H9l-5 4z M8 8h8 M8 12h5',analytics:'M4 20V10 M10 20V4 M16 20v-8 M22 20H2',history:'M3 10a9 9 0 1 1 1 8 M3 4v6h6 M12 7v6l4 2',developer:'M8 5l-6 7 6 7 M16 5l6 7-6 7 M14 3l-4 18',settings:'M4 7h16 M4 17h16 M8 4v6 M16 14v6',spark:'M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z',search:'M16 16l5 5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',bell:'M5 17h14l-2-4V8a5 5 0 0 0-10 0v5z M10 21h4',arrow:'M5 12h14 M14 7l5 5-5 5',chevron:'M8 5l7 7-7 7',menu:'M3 6h18 M3 12h18 M3 18h18',check:'M4 12l5 5L20 6',lock:'M6 10h12v11H6z M8 10V6a4 4 0 0 1 8 0v4'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.files}"/></svg>`}
const navs=[['dashboard','Dashboard'],['upload','Upload Data'],['files','My Files'],['explorer','Data Explorer'],['query','AI Query'],['analytics','Analytics'],['history','Processing History'],['developer','Developer View'],['settings','Settings']];
let user=null,page='dashboard',period=30,selected=[],filter='',typeFilter='all',queryResult=false,filesPage=0;
const sampleRows=[['C-1001','Acme Corporation','North America',148200,124],['C-1002','Meridian Group','Europe',92500,86],['C-1003','Nova Industries','Asia Pacific',76400,72],['C-1004','Vertex Systems','North America',118700,103],['C-1005','Atlas Partners','Latin America',48200,45]];
let files=[{id:1,name:'sales_report_Q3.csv',ext:'csv',size:2450000,category:'Structured',status:'Completed',date:'Oct 07, 2026',sample:true},{id:2,name:'quarterly_review.pdf',ext:'pdf',size:1810000,category:'Document',status:'Completed',date:'Oct 06, 2026',sample:true},{id:3,name:'customer_insights.xlsx',ext:'xlsx',size:820000,category:'Structured',status:'Completed',date:'Oct 06, 2026',sample:true},{id:4,name:'invoice_scan.png',ext:'png',size:450000,category:'Image',status:'Pending',date:'Oct 05, 2026',sample:true},{id:5,name:'product_catalog.json',ext:'json',size:126000,category:'Structured',status:'Completed',date:'Oct 04, 2026',sample:true}];
async function api(path,body){const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Demo-Request':'1'},...(body===undefined?{}:{body:JSON.stringify(body)})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hide'),4000)}
function brand(){return `<div class="brand"><div class="brandmark">${icon('analytics')}</div><div class="brandtext">clarity<small>DATA INTELLIGENCE</small></div></div>`}
function login(){user=null;$('root').innerHTML=`<div class="login"><section class="loginArt">${brand()}<div><div class="eyebrow">FROM INFORMATION TO IMPACT</div><h1>Your data.<br>A clearer perspective.</h1><p>Bring your files, insights, and decisions together in one intelligent workspace.</p><div class="abstract"><i style="height:22%"></i><i style="height:38%"></i><i style="height:30%"></i><i style="height:56%"></i><i style="height:45%"></i><i style="height:72%"></i><i style="height:61%"></i><i style="height:94%"></i></div></div><small class="subtle">ONE WORKSPACE. EVERY POSSIBILITY.</small></section><div class="loginFormWrap"><form class="loginForm" id="loginForm"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to your workspace</h1><p>A little clarity goes a long way.<br>Let’s see what your data has to say.</p><label for="email">Email address</label><input id="email" type="email" value="teja@demo.com" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" value="Demo@123" required autocomplete="current-password"><button class="primary" id="signIn">Sign in ${icon('arrow')}</button><div id="loginError" class="loginError" role="alert"></div><div class="demoNote"><b>Presentation accounts</b><br>Developer: teja@demo.com<br>User: user@demo.com<br>Password for both: <b>Demo@123</b><br>Local demo · Sample analytics · No external services</div></form></div></div>`;$('loginForm').onsubmit=async e=>{e.preventDefault();$('signIn').disabled=true;try{user=await api('login',{email:$('email').value,password:$('password').value});page='dashboard';shell()}catch(e){$('loginError').textContent=location.protocol==='file:'?'Run python server.py, then open http://127.0.0.1:8000 for login.':e.message;$('signIn').disabled=false}}}
function shell(){if(!user)return login();$('root').innerHTML=`<aside class="sidebar" id="sidebar">${brand()}<div class="navlabel">WORKSPACE</div><nav class="nav">${navs.filter(([id])=>id!=='developer'||user.role==='DEVELOPER').map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${icon(id)}<span>${label}</span></button>`).join('')}</nav><div class="sidefoot"><div class="notice"><span class="live"></span>Presentation workspace</div><p class="notice" style="font-size:10px;margin-top:9px">Sample data · Local session</p></div></aside><div class="workspace"><header class="header"><div class="row"><button class="mobileMenu" aria-label="Open navigation" onclick="$('sidebar').classList.toggle('open')">${icon('menu')}</button><button class="textButton" title="Collapse sidebar" onclick="document.body.classList.toggle('compact')">${icon('menu')}</button><div class="crumb">Workspace &nbsp; / &nbsp; <b>${esc(navs.find(n=>n[0]===page)?.[1]||'My Profile')}</b></div></div><div class="headerRight"><span class="badge blue">DEMO WORKSPACE</span><button class="textButton" aria-label="Search files" onclick="go('files')">${icon('search')}</button><button class="textButton" aria-label="Notifications" onclick="toast('You’re all caught up. No new notifications.')">${icon('bell')}</button><button class="profileButton" onclick="$('profileMenu').classList.toggle('hide')"><span class="avatar">${esc(user.name[0])}</span><span>${esc(user.name)}<small>${user.role==='DEVELOPER'?'Developer':'Workspace member'}</small></span></button></div><div class="menu hide" id="profileMenu"><button onclick="go('profile')">My Profile</button><button onclick="go('settings')">Settings</button><button onclick="logout()">Log out</button></div></header><main class="content" id="content"></main></div>`;render()}
async function logout(){try{await api('logout',{});files=files.filter(f=>f.sample);selected=[];queryResult=false;document.body.classList.remove('compact');login()}catch(e){toast(e.message)}}
function go(p){if(p==='developer'&&user.role!=='DEVELOPER')return toast('Developer access required');page=p;filter='';filesPage=0;shell()}
function head(title,subtitle,actions=''){return `<div class="pagehead"><div><div class="eyebrow">YOUR INTELLIGENCE WORKSPACE</div><h1>${title}</h1><p>${subtitle}</p></div><div class="row">${actions}</div></div>`}
function badge(s){return `<span class="badge ${s==='Completed'?'':s==='Pending'?'amber':'gray'}">${s==='Completed'?'✓ ':''}${esc(s)}</span>`}
function size(n){return n>=1000000?(n/1000000).toFixed(1)+' MB':Math.ceil(n/1000)+' KB'}
function fileTable(list){return `<div class="tableWrap"><table><thead><tr><th>File name</th><th>Category</th><th>Size</th><th>Status</th><th>Uploaded</th><th></th></tr></thead><tbody>${list.map(f=>`<tr><td><span class="fileIcon ${f.category==='Structured'?'green':f.category==='Document'?'amber':''}">${icon('files')}</span><strong>${esc(f.name)}</strong></td><td>${esc(f.category)}</td><td>${size(f.size)}</td><td>${badge(f.status)}</td><td>${f.date}</td><td><button class="textButton" onclick="viewFile(${f.id})">View</button>${page==='files'?`<button class="textButton" onclick="removeFile(${f.id})" aria-label="Delete ${esc(f.name)}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching files. Try another search or upload a file.</td></tr>'}</tbody></table></div>`}
function kpis(analytics=false){const data=analytics?[['Revenue','$486.2K','12.8%','vs. last quarter','analytics'],['Customers','2,845','8.2%','vs. last quarter','files'],['Orders','8,492','16.4%','vs. last quarter','explorer'],['Avg. order value','$57.25','4.1%','vs. last quarter','query']]:[['Total files',files.length,'','in this demo workspace','files'],['Structured data',files.filter(f=>f.category==='Structured').length,'','datasets ready to explore','explorer'],['Processed files',files.filter(f=>f.status==='Completed').length,'','sample processing records','check'],['AI queries','24','','sample queries this month','spark']];return `<div class="kpis">${data.map(([l,v,change,t,i])=>`<div class="card kpi"><div class="kpiTop">${l}<span class="kpiIcon">${icon(i)}</span></div><div class="kpiValue">${v}</div><small><span class="positive">${change?'↗ '+change:''}</span>${t}</small></div>`).join('')}</div>`}
function lineChart(){const lines=period===7?[145,160,120,140,85,100,47]:period===90?[180,159,171,114,131,86,41]:[166,151,160,109,123,79,59];const points=lines.map((y,i)=>`${50+i*83},${y}`).join(' ');const second=lines.map((y,i)=>`${50+i*83},${Math.min(199,y+32)}`).join(' ');return `<div class="chart"><svg viewBox="0 0 600 240" role="img" aria-label="Illustrative uploaded and processed data trend"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6682ee" stop-opacity=".16"/><stop offset="1" stop-color="#6682ee" stop-opacity="0"/></linearGradient></defs>${[40,80,120,160,200].map((y,i)=>`<line x1="45" y1="${y}" x2="563" y2="${y}" stroke="#edf0f6"/><text x="10" y="${y+4}" fill="#9da9ba" font-size="10">${80-i*20}</text>`).join('')}<polygon points="50,200 ${points} 548,200" fill="url(#fade)"/><polyline points="${second}" fill="none" stroke="#c1cdf4" stroke-width="2.5" stroke-dasharray="5 5"/><polyline points="${points}" fill="none" stroke="#5d79e5" stroke-width="3" stroke-linejoin="round"/>${lines.map((y,i)=>`<circle cx="${50+i*83}" cy="${y}" r="3" fill="white" stroke="#5d79e5" stroke-width="2"/>`).join('')}${(period===7?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:period===90?['Jul 09','Jul 24','Aug 08','Aug 23','Sep 07','Sep 22','Oct 07']:['Sep 07','Sep 12','Sep 17','Sep 22','Sep 27','Oct 02','Oct 07']).map((v,i)=>`<text x="${50+i*83}" y="228" text-anchor="middle" fill="#9da9ba" font-size="9">${v}</text>`).join('')}</svg></div><div class="legend"><span><i class="dot" style="background:#5d79e5"></i>Uploaded</span><span><i class="dot" style="background:#bdc9f0"></i>Processed</span><span>Illustrative trend</span></div>`}
function distribution(){const c=['Structured','Document','Image'].map(cat=>files.filter(f=>f.category===cat).length),total=files.length,a=total?100*c[0]/total:0,b=total?100*(c[0]+c[1])/total:0;return `<div class="card"><div class="cardHead"><div><h2>File distribution</h2><p>A closer look at your workspace</p></div></div><div class="distribution"><div class="donut" style="background:conic-gradient(#5873e5 0 ${a}%,#96a8f4 ${a}% ${b}%,#cfd8fc ${b}% 100%)"><div class="donutInner"><strong>${total}</strong><small>Total files</small></div></div><div class="distList">${['Structured','Documents','Images'].map((v,i)=>`<div><i class="dot" style="background:${['#5873e5','#96a8f4','#cfd8fc'][i]}"></i>${v}<b>${c[i]}</b></div>`).join('')}</div></div><div class="cardFoot"><span class="live"></span>Includes sample and session files</div></div>`}
function dashboard(){return head(`Good morning, ${esc(user.name)} ☀`,'Here’s a clearer picture of your data workspace.',`<button onclick="exportReport()">Export report</button><button class="primary" onclick="go('upload')">+ Upload data</button>`)+kpis()+`<div class="gridMain"><div class="card"><div class="cardHead"><div><h2>Data overview</h2><p>File activity over time</p></div><div class="seg">${[7,30,90].map(n=>`<button class="${period===n?'on':''}" onclick="period=${n};render()">${n} days</button>`).join('')}</div></div>${lineChart()}</div>${distribution()}</div><div class="card"><div class="cardHead" style="padding-bottom:22px"><div><h2>Recent uploads</h2><p>Your latest datasets and documents</p></div><button class="textButton" onclick="go('files')">View all files &nbsp; →</button></div>${fileTable(files.slice(0,4))}</div><div class="insight">${icon('spark')}<div><h3>Your next insight starts with a question.</h3><p>Explore sample sales performance, spot trends, and turn results into a clear story.</p></div><div class="spacer"></div><button class="textButton" onclick="go('query')">Ask your data →</button></div>`}
function upload(){return head('Bring your data together','One place for datasets, documents, and images.')+`<div class="card"><div class="cardHead"><h2>Upload files</h2><span class="badge blue">LOCAL PREVIEW</span></div><div class="uploadZone" id="dropzone"><div class="uploadCircle">${icon('upload')}</div><h2>Drag & drop your files here</h2><p>Keep everything you need for your next insight in one place.</p><button class="primary" onclick="$('fileInput').click()">Browse files</button><input class="hide" id="fileInput" type="file" multiple accept=".csv,.xlsx,.json,.pdf,.docx,.png,.jpg,.jpeg"><div class="formats">${['CSV','XLSX','JSON','PDF','DOCX','PNG','JPG'].map(x=>`<span>${x}</span>`).join('')}</div><p style="margin-bottom:0">Up to 10 MB per file</p></div><div class="padded" style="padding-top:0"><div id="queue"></div><p class="notice">Demo preview only: files stay in this browser session. No file content is uploaded to the server, and OCR is not performed.</p></div></div>`}
function queue(){if(!$('queue'))return;$('queue').innerHTML=selected.length?`<h3 style="margin-bottom:12px">Selected files (${selected.length})</h3>${selected.map((f,i)=>`<div class="settingsRow"><span>${icon('files')} &nbsp; ${esc(f.name)} <small class="subtle">${size(f.size)}</small></span><button class="textButton" onclick="selected.splice(${i},1);queue()">Remove</button></div>`).join('')}<button class="primary" style="margin:20px 0" onclick="addFiles()">Add to workspace</button>`:''}
function pick(items){for(const f of items){const ext=f.name.split('.').pop().toLowerCase();if(!['csv','xlsx','json','pdf','docx','png','jpg','jpeg'].includes(ext)||f.size>10*1024*1024){toast('Unsupported file or larger than 10 MB: '+f.name);continue}selected.push(f)}queue()}
function addFiles(){for(const f of selected){const ext=f.name.split('.').pop().toLowerCase();files.unshift({id:Date.now()+Math.random(),name:f.name,ext,size:f.size,category:['csv','xlsx','json'].includes(ext)?'Structured':['pdf','docx'].includes(ext)?'Document':'Image',status:'Preview only',date:new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}),blob:f})}selected=[];go('files');toast('Files added to this session. No backend processing was run.')}
function myFiles(){const filtered=files.filter(f=>f.name.toLowerCase().includes(filter.toLowerCase())&&(typeFilter==='all'||f.category===typeFilter));const pages=Math.max(1,Math.ceil(filtered.length/5));filesPage=Math.min(filesPage,pages-1);return head('My files','Everything in your workspace, organized and within reach.',`<button class="primary" onclick="go('upload')">+ Upload data</button>`)+`<div class="filters"><input class="searchInput" id="fileSearch" placeholder="Search files…" value="${esc(filter)}" aria-label="Search files"><select id="typeFilter" aria-label="Filter category">${['all','Structured','Document','Image'].map(v=>`<option ${v===typeFilter?'selected':''} value="${v}">${v==='all'?'All categories':v}</option>`).join('')}</select></div><div class="card">${fileTable(filtered.slice(filesPage*5,filesPage*5+5))}<div class="cardFoot row"><span>${filtered.length} files · Page ${filesPage+1} of ${pages}</span><div class="spacer"></div><button ${filesPage===0?'disabled':''} onclick="filesPage--;render()">Previous</button><button ${filesPage>=pages-1?'disabled':''} onclick="filesPage++;render()">Next</button></div></div>`}
async function viewFile(id){const f=files.find(f=>f.id===id);$('modalTitle').textContent=f.name;let content;if(f.blob&&['csv','json'].includes(f.ext)){content=await f.blob.slice(0,12000).text()}else{content=JSON.stringify({filename:f.name,category:f.category,size:size(f.size),status:f.status,source:f.sample?'Sample presentation record':'Browser session only',note:'Binary file content is not parsed in this demo.'},null,2)}$('modalBody').innerHTML=`<pre>${esc(content)}</pre><p class="notice">${f.blob?'First 12 KB shown for text files.':'Sample metadata; no original source file is included.'}</p>`;$('modal').showModal()}
function removeFile(id){const f=files.find(f=>f.id===id);if(confirm('Remove '+f.name+' from this demo workspace?')){files=files.filter(x=>x.id!==id);render();toast('Removed from this session')}}
function explorer(){return head('Explore the details','A sample customer dataset, ready for your review.',`<span class="badge blue">SAMPLE DATA</span>`)+`<div class="card"><div class="cardHead"><div><h2>Customer performance</h2><p>5 records · 5 columns · sales_report_Q3.csv</p></div><button onclick="download('customers.csv','Customer ID,Customer Name,Region,Revenue,Orders\n'+sampleRows.map(r=>r.join(',')).join('\n'),'text/csv')">Export CSV</button></div><div class="padded"><input id="explorerSearch" placeholder="Filter by customer or region…" aria-label="Filter dataset" style="width:100%"></div><div id="sampleTable"></div></div>`}
function sampleTable(q=''){const rows=sampleRows.filter(r=>r.join(' ').toLowerCase().includes(q.toLowerCase()));$('sampleTable').innerHTML=`<div class="tableWrap"><table><thead><tr>${['Customer ID','Customer name','Region','Revenue','Orders'].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===3?'$'+v.toLocaleString():esc(v)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="5">No matching records.</td></tr>'}</tbody></table></div>`}
function bars(){return `<div class="bars">${[['North America',42,'$204.2K'],['Europe',28,'$136.1K'],['Asia Pacific',20,'$97.2K'],['Latin America',10,'$48.7K']].map(([n,v,t])=>`<div class="barrow"><span>${n}</span><div class="bartrack"><div class="barfill" style="width:${v*2}%"></div></div><b>${t}</b></div>`).join('')}</div>`}
function query(){return head('Ask your data','Good questions lead to better decisions.',`<span class="badge blue">SCRIPTED DEMO</span>`)+`<div class="card padded"><div class="row">${icon('spark')}<h2>What would you like to understand?</h2></div><form id="queryForm" class="querybox"><input id="question" placeholder="Ask a question about your data…" aria-label="Your question" required><button class="primary">Generate insight →</button></form><div class="chips">${['Show total sales by region','Which region is growing fastest?','Summarize our Q3 performance'].map(q=>`<button onclick="$('question').value=this.textContent;ask()">${q}</button>`).join('')}</div><p class="notice" style="margin-top:16px">This presentation uses a prepared sales example. No LLM or live database is connected.</p></div><div id="queryAnswer">${queryResult?answer():''}</div>`}
function answer(){return `<div class="card answer"><div class="row"><span class="badge blue">SAMPLE RESPONSE</span><span class="subtle" style="font-size:11px">Q3 sales overview</span></div><h2 style="margin-top:18px">North America leads the way.</h2><p style="color:#728098;font-size:13px">In this sample, North America contributed <strong style="color:var(--ink)">42% of total revenue</strong>, followed by Europe at 28%. Total revenue reached <strong style="color:var(--ink)">$486.2K</strong> across four regions.</p>${bars()}<div class="cardFoot" style="margin-top:25px;padding-left:0">Source: illustrative Q3 sales dataset · Currency: USD</div>${user.role==='DEVELOPER'?`<details><summary style="cursor:pointer;font-size:12px;color:var(--blue)">View example SQL</summary><pre>SELECT region, SUM(revenue) AS total_revenue\nFROM sales\nGROUP BY region\nORDER BY total_revenue DESC;</pre></details>`:''}</div>`}
function ask(){if(!$('question').value.trim())return;queryResult=true;$('queryAnswer').innerHTML=answer();toast('Showing the prepared Q3 sales example.')}
function analytics(){return head('Performance at a glance','A presentation-ready view of sample business performance.',`<span class="badge blue">SAMPLE DATA · Q3 2026</span>`)+kpis(true)+`<div class="twoCol"><div class="card padded"><h2>Revenue by region</h2><p class="notice">Share of $486.2K sample revenue</p>${bars()}</div><div class="card"><div class="cardHead"><div><h2>Workspace activity</h2><p>Illustrative file activity</p></div></div>${lineChart()}</div></div>`}
function history(){return head('Processing history','A clear view of every step in the journey.',`<span class="badge blue">SAMPLE HISTORY</span>`)+`<div class="card"><div class="tableWrap"><table><thead><tr><th>File</th><th>Process type</th><th>Duration</th><th>Status</th></tr></thead><tbody>${files.map(f=>`<tr><td><strong>${esc(f.name)}</strong></td><td>${f.sample?f.category==='Structured'?'Structured parsing':f.category==='Image'?'OCR extraction':'Document extraction':'Not processed'}</td><td>${f.status==='Completed'?'1.2 s':'—'}</td><td>${badge(f.status)}</td></tr>`).join('')}</tbody></table></div><div class="cardFoot">Timings are illustrative. New session files are not processed.</div></div>`}
function developer(){return head('Developer console','A technical view of the proposed data journey.',`<span class="badge blue">DEVELOPER ACCESS</span>`)+`<div class="card padded"><h2>Processing pipeline</h2><p class="notice" style="margin-top:8px">Architecture preview · Sample execution</p><div class="pipeline">${['User upload','Validation','Classification','Extraction','JSON storage','Query engine','Visualization'].map(s=>`<span>${s}</span>`).join('')}</div></div><div class="twoCol" style="margin-top:24px"><div class="card padded"><h2>Example query execution</h2><pre id="devOutput">Checking developer access…</pre></div><div class="card padded"><h2>Extracted JSON · example</h2><pre>${esc(JSON.stringify({file_id:101,filename:'sales_report_Q3.csv',category:'STRUCTURED',status:'COMPLETED',rows:24500,columns:18,mode:'sample'},null,2))}</pre></div></div>`}
function settings(){return head('Workspace settings','Make the workspace feel like yours.')+`<div class="card padded"><h2>Preferences</h2><div class="settingsRow"><div><h3>Presentation notifications</h3><p>Enable local demo notifications.</p></div><input class="toggle" type="checkbox" checked onchange="toast(this.checked?'Demo notifications enabled':'Demo notifications disabled')" aria-label="Demo notifications"></div><div class="settingsRow"><div><h3>Appearance</h3><p>A focused, light workspace.</p></div><span class="badge blue">LIGHT THEME</span></div><div class="settingsRow"><div><h3>Account & access</h3><p>${esc(user.email)} · ${user.role}</p></div><button onclick="go('profile')">View profile</button></div><div class="settingsRow"><div><h3>Session</h3><p>Server-managed login. Sessions reset when the Python server stops.</p></div><button onclick="logout()">Log out</button></div><p class="notice" style="margin-top:20px">Demo preferences apply only while this page is open.</p></div>`}
function profile(){return head('My profile','Your identity in this workspace.')+`<div class="card padded" style="max-width:650px"><div class="row"><span class="avatar" style="width:60px;height:60px;font-size:22px">${esc(user.name[0])}</span><div><h2>${esc(user.name)}</h2><p class="notice">${esc(user.email)}</p></div></div><div class="settingsRow"><span>Role</span><span class="badge blue">${user.role}</span></div><div class="settingsRow"><span>Account status</span>${badge('Completed').replace('Completed','Active')}</div><div class="settingsRow"><span>Workspace</span><span>Local presentation demo</span></div><p class="notice" style="margin-top:20px">Demo account details are defined in server.py.</p></div>`}
function render(){const views={dashboard,upload,files:myFiles,explorer,query,analytics,history,developer,settings,profile};$('content').innerHTML=(views[page]||dashboard)()+'<div class="footerNote">CLARITY · DATA INTELLIGENCE &nbsp; / &nbsp; PRESENTATION DEMO</div>';if(page==='upload'){queue();$('fileInput').onchange=e=>pick(e.target.files);const z=$('dropzone');z.ondragover=e=>{e.preventDefault();z.classList.add('drag')};z.ondragleave=()=>z.classList.remove('drag');z.ondrop=e=>{e.preventDefault();z.classList.remove('drag');pick(e.dataTransfer.files)}}if(page==='files'){$('fileSearch').oninput=e=>{const pos=e.target.selectionStart;filter=e.target.value;filesPage=0;render();$('fileSearch').focus();$('fileSearch').setSelectionRange(pos,pos)};$('typeFilter').onchange=e=>{typeFilter=e.target.value;filesPage=0;render()}}if(page==='explorer'){sampleTable();$('explorerSearch').oninput=e=>sampleTable(e.target.value)}if(page==='query')$('queryForm').onsubmit=e=>{e.preventDefault();ask()};if(page==='developer')api('developer').then(d=>{if($('devOutput'))$('devOutput').textContent=JSON.stringify(d,null,2)}).catch(e=>{if($('devOutput'))$('devOutput').textContent=e.message})}
function download(name,content,type='text/plain'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportReport(){download('clarity-demo-report.txt','CLARITY — PRESENTATION DEMO\nSample workspace summary\n\nFiles: '+files.length+'\nCompleted sample files: '+files.filter(f=>f.status==='Completed').length+'\nSample Q3 revenue: $486,200\nNorth America share: 42%\n\nAnalytics are illustrative, not live business data.');toast('Sample report exported')}
api('me').then(u=>{user=u;shell()}).catch(login);
</script></body></html>
